# agentmemory iii-engine (alternate host ports to avoid conflict with native :3111/:3113)
# API:    http://127.0.0.1:3120  (container 3111)
# Streams http://127.0.0.1:3121  (container 3112)
services:
  iii-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - agentmemory-iii-data:/data
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data && chmod 755 /data"]
    restart: "no"

  iii-engine:
    image: iiidev/iii:${AGENTMEMORY_III_VERSION:-0.11.2}
    user: "65532:65532"
    depends_on:
      iii-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3120:3111"
      - "127.0.0.1:3121:3112"
      - "127.0.0.1:49135:49134"
    volumes:
      - agentmemory-iii-data:/data
      - ./iii-config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-iii-data:
    name: react-training-agentmemory-iii-data
