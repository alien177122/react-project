services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-project-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-600000}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-7}
      REGISTER_MAX_ATTEMPTS: ${REGISTER_MAX_ATTEMPTS:-5}
      DB_PATH: /app/data/gym.db
      WORKSPACE_FILES_ROOT: /app/workspace-files
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_OCR_MODEL: ${OLLAMA_OCR_MODEL:-glm-ocr}
    volumes:
      - ./docker-data:/app/data
      - ./workspace-files:/app/workspace-files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
