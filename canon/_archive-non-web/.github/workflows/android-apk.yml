name: android-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/macos/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Restore signing files
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || { echo "ERROR: ANDROID_KEYSTORE_B64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ERROR: ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ERROR: ANDROID_KEY_PASSWORD is missing"; exit 1; }
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            printf 'storeFile=app/release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed APK
        run: |
          test -n "$JAVA_HOME" || { echo "ERROR: JAVA_HOME is missing"; exit 1; }
          test -n "$ANDROID_HOME" || { echo "ERROR: ANDROID_HOME is missing"; exit 1; }
          test -f android/key.properties || { echo "ERROR: android/key.properties is missing"; exit 1; }
          test -f android/app/release.keystore || { echo "ERROR: release.keystore is missing"; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "ERROR: Android SDK 35 is missing"; exit 1; }
          test -d "$ANDROID_HOME/ndk/26.1.10909125" || { echo "ERROR: NDK 26.1.10909125 is missing"; exit 1; }
          cd android
          ./gradlew clean assembleRelease

      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | tee android-signature-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trainingappmac-signed-apk
          path: |
            apps/macos/android/app/build/outputs/apk/release/app-release.apk
            apps/macos/android-signature-report.txt
